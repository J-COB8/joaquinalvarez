     joaquinalvarezmercado.vercel.app/media-kit
     Si cambia el PDF, regenera assets/img/media-kit-900/1660.webp y -og.jpg. -->
<style>
@font-face{
  font-family:"Archivo";
  src:url("/assets/fonts/archivo-latin.woff2") format("woff2");
  font-weight:100 900; font-stretch:62% 125%; font-style:normal; font-display:swap;
}
:root{
  --paper:#ffffff;
  --ink:#000000;
  --graphite:#6b6b6b;
  --line:#e6e6e6;
  --sweep:#f4f4f2;
  --yellow:#fcd404;
  --gutter:clamp(16px, 4.6vw, 64px);
  --sh-print:0 1px 1px rgba(0,0,0,.12), 2px 6px 12px rgba(0,0,0,.10), 6px 18px 30px rgba(0,0,0,.08);
}
*,*::before,*::after{ box-sizing:border-box; }
*{ margin:0; padding:0; }
html{ background:var(--sweep); -webkit-text-size-adjust:100%; }
body{
  font-family:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16px; line-height:1.5; color:var(--ink); background:var(--sweep);
  -webkit-font-smoothing:antialiased; font-synthesis:none;
}
img,svg{ display:block; max-width:100%; }
a{ color:inherit; }
button{ font:inherit; color:inherit; cursor:pointer; background:none; border:0; }
::selection{ background:var(--yellow); color:var(--ink); }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.barra{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:8px;
  padding:8px var(--gutter); padding-top:calc(8px + env(safe-area-inset-top));
  background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.volver{ flex:1; min-width:0; display:inline-flex; align-items:center; gap:6px; min-height:44px; font-weight:750; letter-spacing:-.01em; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.volver svg{ flex:none; width:18px; height:18px; }
.volver:hover span{ text-decoration:underline; text-underline-offset:.18em; }
.copiar{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; border:1.5px solid var(--ink); font-size:14px; font-weight:650; white-space:nowrap; transition:background .2s, color .2s; }
.copiar.is-ok{ background:var(--ink); color:var(--paper); }
.bajar{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:14px; font-weight:650; text-decoration:none; white-space:nowrap; }
.copiar svg,.bajar svg{ width:16px; height:16px; flex:none; }
@media (max-width:520px){
  .copiar,.bajar{ padding:0 13px; }
  .corto{ display:none; }
}

.hoja{ max-width:880px; margin:0 auto; padding:clamp(12px, 3vw, 40px) clamp(10px, 3vw, 40px) calc(40px + env(safe-area-inset-bottom)); }
.hoja img{ width:100%; height:auto; background:var(--paper); box-shadow:var(--sh-print); }
.pie{ margin-top:20px; text-align:center; font-size:14px; color:var(--graphite); }
.pie a{ font-weight:650; color:var(--ink); text-underline-offset:.18em; }
</style>
</head>
<body>

<header class="barra">
  <a class="volver" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Joaquín Álvarez Mercado</span></a>
  <button class="copiar" type="button" data-copiar-enlace aria-label="Copiar enlace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="corto" data-copiar-texto>Copiar enlace</span></button>
  <a class="bajar" href="/assets/media-kit.pdf" download="Media Kit — Joaquín Álvarez Mercado.pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Descargar<span class="corto"> PDF</span></span></a>
</header>

<main class="hoja">
  <h1 class="sr">Media kit de Joaquín Álvarez Mercado</h1>
  <img src="/assets/img/media-kit-900.webp" srcset="/assets/img/media-kit-900.webp 900w, /assets/img/media-kit-1660.webp 1660w" sizes="(min-width:880px) 800px, 100vw" width="1659" height="2400" decoding="async" fetchpriority="high" alt="Media kit 2026 de Joaquín Álvarez Mercado (@joaquin.alvarezm). 1.1 M de vistas en un solo video, con una cuenta de 3,000 seguidores. 1.65 M de vistas totales, 8,047 seguidores entre Instagram y TikTok, 10.8% de engagement en Instagram y 176 K interacciones. Videos destacados: Trisol, Kavak y KidZania. Audiencia de 18 a 34 años, sobre todo en México. Formatos: video integrado, video dedicado, historias y contenido UGC. Contacto: joaquinalvarezme@gmail.com." />
  <p class="pie">¿Quieres trabajar conmigo? <a href="mailto:joaquinalvarezme@gmail.com">joaquinalvarezme@gmail.com</a></p>
</main>

<script>
(function(){
  var b = document.querySelector('[data-copiar-enlace]');
  var t = document.querySelector('[data-copiar-texto]');
  var url = 'https://joaquinalvarezmercado.vercel.app/media-kit';
  b.addEventListener('click', function(){
    var listo = function(){
      b.classList.add('is-ok'); t.textContent = 'Enlace copiado'; b.setAttribute('aria-label', 'Enlace copiado');
      setTimeout(function(){ b.classList.remove('is-ok'); t.textContent = 'Copiar enlace'; b.setAttribute('aria-label', 'Copiar enlace'); }, 1800);
    };
    if (navigator.share && matchMedia('(pointer:coarse)').matches){
      navigator.share({ title: 'Media kit · Joaquín Álvarez Mercado', url: url }).catch(function(){});
    } else if (navigator.clipboard){
      navigator.clipboard.writeText(url).then(listo, function(){ prompt('Copia este enlace:', url); });
    } else {
      prompt('Copia este enlace:', url);
    }
  });
})();
</script>
</body>
</html>
